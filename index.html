<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0809">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EngineGuide">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <title>EngineGuide</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main id="app">
    <!-- ЭКРАН 1: ОНБОРДИНГ -->
    <section id="screen-onboarding" class="screen active">
      <header class="onboarding-header">
        <h1>EngineGuide</h1>
        <p class="subtitle">Select your rank</p>
      </header>
      
      <div class="role-list stagger-list">
        <button class="role-card" data-role="chief">
          <span class="role-title">Chief Engineer</span>
          <span class="role-desc">Full access to all equipment</span>
        </button>
        <button class="role-card" data-role="2nd">
          <span class="role-title">2nd Engineer</span>
          <span class="role-desc">Main engine & auxiliary systems</span>
        </button>
        <button class="role-card" data-role="3rd">
          <span class="role-title">3rd Engineer</span>
          <span class="role-desc">Generators, boilers & purifiers</span>
        </button>
        <button class="role-card" data-role="4th">
          <span class="role-title">4th Engineer</span>
          <span class="role-desc">Pumps, compressors & separators</span>
        </button>
        <button class="role-card" data-role="cadet">
          <span class="role-title">Cadet</span>
          <span class="role-desc">Learning mode</span>
        </button>
      </div>
    </section>
    <!-- ЭКРАН 2А: ВЫБОР ОБОРУДОВАНИЯ — КАТЕГОРИИ -->
    <section id="screen-equipment" class="screen">
      <header class="onboarding-header" style="margin-top: 20px; margin-bottom: 24px;">
        <h2 class="screen-title">Your Watch</h2>
        <p class="subtitle">Select your equipment</p>
      </header>
      
      <div id="equipment-categories" class="equipment-list">
        <!-- Сюда JS будет вставлять карточки категорий -->
      </div>

      <div class="bottom-action">
        <button id="btn-save-equipment" class="btn-primary">Confirm Selection</button>
      </div>
    </section>

    <!-- ЭКРАН 2Б: ВЫБОР ОБОРУДОВАНИЯ — МОДЕЛИ В КАТЕГОРИИ -->
    <section id="screen-equipment-models" class="screen">
      <header class="screen-header" style="margin-bottom: 12px;">
        <button class="btn-back" onclick="equipmentBack()">← Back</button>
      </header>
      <h2 id="equipment-models-title" class="screen-title" style="font-size:28px; margin-bottom:20px;"></h2>
      <div id="equipment-models-list" class="equipment-list" style="padding-bottom: 120px;">
        <!-- Сюда JS будет вставлять карточки моделей -->
      </div>
      <div class="bottom-action">
        <button id="btn-save-equipment-models" class="btn-primary">Confirm Selection</button>
      </div>
    </section>
        <!-- ЭКРАН 3: MY WATCH -->
    <section id="screen-watch" class="screen">
      <header class="screen-header">
        <div>
          <h2 class="screen-title">My Watch</h2>
          <p class="subtitle">Your equipment</p>
        </div>
        <button id="btn-reset" class="btn-icon" title="Reset App">↺</button>
      </header>

      <div class="search-container">
        <input type="text" id="search-watch" class="search-input" placeholder="Search equipment...">
      </div>
      
      <div id="watch-list" class="equipment-list" style="padding-bottom: 100px;">
        <!-- Сюда JS вставит карточки выбранного оборудования -->
      </div>
    </section>

    <!-- ЭКРАН 4: БИБЛИОТЕКА -->
    <section id="screen-library" class="screen">
      <header class="screen-header">
        <div>
          <h2 class="screen-title">Library</h2>
          <p class="subtitle">All equipment</p>
        </div>
      </header>
      <div class="search-container">
        <input type="text" id="search-library" class="search-input" placeholder="Search all equipment...">
      </div>
      <div id="library-list" class="equipment-list" style="padding-bottom: 100px;">
        <!-- Сюда JS вставит карточки -->
      </div>
    </section>

    <!-- ЭКРАН 4.5: БИБЛИОТЕКА — УРОВЕНЬ ВЛОЖЕНИЯ (Производители / Модели / Подтипы) -->
    <section id="screen-library-drill" class="screen">
      <header class="screen-header" style="margin-bottom: 12px;">
        <button class="btn-back" onclick="libraryBack()">← Back</button>
      </header>
      <div id="library-drill-content"></div>
    </section>

    <!-- ЭКРАН 5: ДЕТАЛИ ДВИГАТЕЛЯ -->
    <section id="screen-engine" class="screen">
      <header class="screen-header" style="margin-bottom: 12px;">
        <button class="btn-back" onclick="engineBack()">← Back</button>
      </header>
      <div id="engine-details-content">
        <!-- Сюда JS вставит инфу о двигателе и список процедур -->
      </div>
    </section>

    <!-- ЭКРАН 6: ДЕТАЛИ ПРОЦЕДУРЫ -->
    <section id="screen-procedure" class="screen">
      <header class="screen-header" style="margin-bottom: 12px;">
        <button class="btn-back" onclick="backToEngine()">← Back</button>
      </header>
      <div id="procedure-details-content">
        <!-- Сюда JS вставит вкладки и данные -->
      </div>
    </section>

  <!-- НИЖНЕЕ МЕНЮ НАВИГАЦИИ (появляется только в главных экранах) -->
  <nav id="bottom-nav" class="bottom-nav" style="display: none;">
    <button class="nav-btn active" data-target="screen-watch">
      <span class="nav-icon">◈</span>
      <span class="nav-label">My Watch</span>
    </button>
    <button class="nav-btn" data-target="screen-library">
      <span class="nav-icon">≡</span>
      <span class="nav-label">Library</span>
    </button>
  </nav>
  </main>
  <script src="app.js"></script>
</body>
</html>
