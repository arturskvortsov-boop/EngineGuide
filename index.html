<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0809">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23e63946'/></svg>">
  <title>EngineGuide</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main id="app">
    <!-- ЭКРАН 1: ОНБОРДИНГ -->
    <section id="screen-onboarding" class="screen active">
      <header class="onboarding-header">
        <h1>EngineGuide</h1>
        <p class="subtitle">Select your rank</p>
      </header>
      
      <div class="role-list stagger-list">
        <button class="role-card" data-role="chief">
          <span class="role-title">Chief Engineer</span>
          <span class="role-desc">Full access to all equipment</span>
        </button>
        <button class="role-card" data-role="2nd">
          <span class="role-title">2nd Engineer</span>
          <span class="role-desc">Main engine & auxiliary systems</span>
        </button>
        <button class="role-card" data-role="3rd">
          <span class="role-title">3rd Engineer</span>
          <span class="role-desc">Generators, boilers & purifiers</span>
        </button>
        <button class="role-card" data-role="4th">
          <span class="role-title">4th Engineer</span>
          <span class="role-desc">Pumps, compressors & separators</span>
        </button>
        <button class="role-card" data-role="cadet">
          <span class="role-title">Cadet</span>
          <span class="role-desc">Learning mode</span>
        </button>
      </div>
    </section>
        <!-- ЭКРАН 2: ВЫБОР ОБОРУДОВАНИЯ -->
    <section id="screen-equipment" class="screen">
      <header class="onboarding-header" style="margin-top: 20px; margin-bottom: 24px;">
        <h2 class="screen-title">Your Watch</h2>
        <p class="subtitle">Select your equipment</p>
      </header>
      
      <div id="equipment-list" class="equipment-list">
        <!-- Сюда JS будет вставлять карточки -->
      </div>

      <!-- Кнопка внизу экрана -->
      <div class="bottom-action">
        <button id="btn-save-equipment" class="btn-primary">Confirm Selection</button>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
